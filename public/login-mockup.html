<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>axlgeph.report · 로그인 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  *{margin:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 620px at 12% -12%,#eceeffe6 0,transparent 55%),radial-gradient(1000px 520px at 105% 112%,#fbeafce6 0,transparent 55%),#f6f6fb;
    color:#111827;padding:24px}
  .card{position:relative;width:100%;max-width:404px;background:#fff;border-radius:26px;
    box-shadow:0 30px 84px -26px rgba(30,27,75,.3);overflow:hidden;
    animation:pop .55s cubic-bezier(.34,1.42,.64,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .head{position:relative;overflow:hidden;padding:30px 34px 22px;background:linear-gradient(180deg,#f4f5ff 0,#fff 100%)}
  .bar{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#6366f1,#8b5cf6,#d946ef)}
  .orb{position:absolute;border-radius:50%;filter:blur(46px);pointer-events:none}
  .o1{width:190px;height:190px;left:-56px;top:-70px;background:rgba(129,140,248,.34)}
  .o2{width:170px;height:170px;right:-46px;top:-40px;background:rgba(232,121,249,.26)}
  .brand{position:relative;font-size:21px;font-weight:800;letter-spacing:-.02em;animation:up .5s .06s both}
  .brand .g{background:linear-gradient(90deg,#4f46e5,#7c3aed,#c026d3);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .beta{font-size:11px;font-weight:700;font-style:italic;color:#9aa1ad;margin-left:5px}
  .pill{position:relative;display:inline-flex;align-items:center;gap:6px;margin-top:15px;padding:5px 11px;border-radius:999px;
    background:#fff;color:#4f46e5;font-size:11.5px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid #e5e7ff;animation:up .5s .1s both}
  h1{position:relative;margin-top:14px;font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.32;animation:up .55s .15s both}
  h1 .g{background:linear-gradient(90deg,#4f46e5,#7c3aed,#c026d3);-webkit-background-clip:text;background-clip:text;color:transparent}
  .desc{position:relative;margin-top:9px;font-size:12.5px;line-height:1.6;color:#6b7280;animation:up .55s .2s both}
  .pad{padding:22px 34px 26px}
  label{display:block;font-size:12px;font-weight:700;color:#374151}
  .inp{margin-top:8px;display:flex;align-items:center;gap:9px;border:1.5px solid #e5e7eb;border-radius:13px;padding:12px 14px;background:#fafafb;transition:.2s}
  .inp:focus-within{border-color:#818cf8;background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.12)}
  .inp svg{color:#9ca3af;flex:none}
  .inp input{border:0;outline:0;background:none;font-size:14px;width:100%;color:#111827}
  .btn{margin-top:16px;width:100%;border:0;cursor:pointer;border-radius:13px;padding:13px;color:#fff;font-size:14px;font-weight:800;
    background:linear-gradient(90deg,#4f46e5,#7c3aed);box-shadow:0 12px 26px -9px rgba(124,58,237,.55);transition:.25s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 16px 32px -9px rgba(124,58,237,.62)}
  .note{margin-top:14px;display:flex;align-items:flex-start;gap:7px;font-size:11.5px;color:#9ca3af;line-height:1.6}
  .note svg{flex:none;margin-top:1px;color:#a5b4fc}
  .foot{border-top:1px solid #f1f1f4;padding:13px 34px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#9ca3af}
  .lock{display:inline-flex;align-items:center;gap:5px}
</style></head>
<body>
  <div class="card">
    <div class="head">
      <div class="bar"></div>
      <div class="orb o1"></div><div class="orb o2"></div>
      <div class="brand"><span>axlgeph</span><span class="g">.report</span><span class="beta">beta</span></div>
      <span class="pill">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        승인된 계정만 접근
      </span>
      <h1><span class="g">LG전자 필리핀법인</span><br>마켓 인텔리전스 대시보드</h1>
      <div class="desc">필리핀 거시경제·가전시장·경쟁사 데이터를 한 곳에서. 회사 이메일을 입력하면 인증 코드를 보내드립니다.</div>
    </div>
    <div class="pad">
      <label>회사 이메일</label>
      <div class="inp">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
        <input placeholder="name@lge.com">
      </div>
      <button class="btn">인증 코드 받기</button>
      <div class="note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        임직원(@lge.com)과 승인된 계정만 접근할 수 있으며, 모든 접속은 Cloudflare 보안 게이트로 보호됩니다.
      </div>
    </div>
    <div class="foot">
      <span class="lock">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Private Access
      </span>
      <span>© 2026 axlgeph.report</span>
    </div>
  </div>
</body></html>

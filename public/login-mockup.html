<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>axlgeph.report · 로그인 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  *{margin:0;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 15% -10%,#eef0ff 0,transparent 55%),radial-gradient(1000px 500px at 100% 110%,#fdf0ff 0,transparent 55%),#f7f7fb;
    color:#111827;padding:24px}
  .card{position:relative;width:100%;max-width:400px;background:#fff;border-radius:26px;
    box-shadow:0 28px 80px -24px rgba(30,27,75,.28);ring:1px solid rgba(0,0,0,.05);overflow:hidden;
    animation:pop .55s cubic-bezier(.34,1.42,.64,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  .top{height:4px;background:linear-gradient(90deg,#6366f1,#8b5cf6,#d946ef)}
  .pad{padding:34px 34px 28px}
  .brand{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .brand .g{background:linear-gradient(90deg,#4f46e5,#7c3aed,#c026d3);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .beta{font-size:11px;font-weight:700;font-style:italic;color:#9ca3af;margin-left:5px}
  .pill{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:5px 11px;border-radius:999px;
    background:#eef2ff;color:#4f46e5;font-size:11.5px;font-weight:700;border:1px solid #e0e7ff}
  h1{margin-top:16px;font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.35}
  p.sub{margin-top:8px;font-size:13px;line-height:1.6;color:#6b7280}
  label{display:block;margin-top:22px;font-size:12px;font-weight:700;color:#374151}
  .inp{margin-top:7px;display:flex;align-items:center;gap:9px;border:1.5px solid #e5e7eb;border-radius:13px;padding:12px 14px;background:#fafafb;transition:.2s}
  .inp:focus-within{border-color:#818cf8;background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.12)}
  .inp svg{color:#9ca3af;flex:none}
  .inp input{border:0;outline:0;background:none;font-size:14px;width:100%;color:#111827}
  .btn{margin-top:18px;width:100%;border:0;cursor:pointer;border-radius:13px;padding:13px;color:#fff;font-size:14px;font-weight:800;
    background:linear-gradient(90deg,#4f46e5,#7c3aed);box-shadow:0 10px 24px -8px rgba(124,58,237,.5);transition:.25s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 14px 30px -8px rgba(124,58,237,.6)}
  .note{margin-top:14px;font-size:11.5px;color:#9ca3af;line-height:1.6;text-align:center}
  .foot{border-top:1px solid #f1f1f4;padding:14px 34px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#9ca3af}
  .lock{display:inline-flex;align-items:center;gap:5px}
</style></head>
<body>
  <div class="card">
    <div class="top"></div>
    <div class="pad">
      <div class="brand"><span>axlgeph</span><span class="g">.report</span><span class="beta">beta</span></div>
      <span class="pill">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        승인된 계정만 접근
      </span>
      <h1>LG전자 필리핀법인<br>마켓 인텔리전스 대시보드</h1>
      <p class="sub">회사 이메일로 로그인하세요. 입력하신 이메일로 <b>인증 코드</b>가 발송됩니다.</p>

      <label>이메일</label>
      <div class="inp">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
        <input placeholder="name@lge.com" value="">
      </div>
      <button class="btn">인증 코드 받기 →</button>
      <p class="note">@lge.com 임직원 및 승인된 계정만 이용할 수 있습니다.<br>Cloudflare 보안 게이트로 보호됩니다.</p>
    </div>
    <div class="foot">
      <span class="lock">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Private Access
      </span>
      <span>© 2026 axlgeph.report</span>
    </div>
  </div>
</body></html>
